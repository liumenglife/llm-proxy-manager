name: CI

on:
  pull_request:
  push:

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            curl \
            file \
            libayatana-appindicator3-dev \
            libclang-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Validate package manager
        run: |
          if [ -f pnpm-lock.yaml ] || [ -f yarn.lock ]; then
            echo "This repository CI currently requires npm. Remove pnpm-lock.yaml or yarn.lock before running CI."
            exit 1
          fi

          if [ ! -f package-lock.json ]; then
            echo "This repository CI currently requires npm and package-lock.json."
            exit 1
          fi

          echo "Using npm ci because package-lock.json was found."

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Frontend lint
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No lint script found, skipping frontend lint."
          fi

      - name: Frontend build
        run: npm run build

      - name: Rust fmt
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: Rust check
        run: cargo check --all-targets --all-features
        working-directory: src-tauri

      - name: Rust test
        run: cargo test --all-targets --all-features
        working-directory: src-tauri

  package:
    name: Package
    runs-on: ubuntu-22.04
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            curl \
            file \
            libayatana-appindicator3-dev \
            libclang-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Validate package manager
        run: |
          if [ -f pnpm-lock.yaml ] || [ -f yarn.lock ]; then
            echo "This repository CI currently requires npm. Remove pnpm-lock.yaml or yarn.lock before running CI."
            exit 1
          fi

          if [ ! -f package-lock.json ]; then
            echo "This repository CI currently requires npm and package-lock.json."
            exit 1
          fi

          echo "Using npm ci because package-lock.json was found."

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Tauri debug build
        run: npm run tauri build -- --debug

      - name: Docker build frontend image
        run: docker build -f docker/Dockerfile -t llm-proxy-manager:ci .

      - name: Docker build backend image
        run: docker build -f docker/Dockerfile.backend --build-arg FRONTEND_IMAGE=llm-proxy-manager:ci -t llm-proxy-manager-backend:ci .

      - name: Docker build backend localdist image
        run: docker build -f docker/Dockerfile.backend.localdist -t llm-proxy-manager-backend-localdist:ci .
